{# 待写日志条目；调用方需要先定义 items（LogTodoItem 列表） #}
{% for item in items %}
  <div class="list-group-item d-flex justify-content-between align-items-start gap-2 py-2">
    <div class="flex-grow-1">
      <div class="d-flex align-items-center flex-wrap gap-2">
        <span class="badge text-bg-warning">待写日志</span>
        <a class="fw-semibold text-decoration-none" href="{{ item.detail_url }}">{{ item.project_name }}</a>
      </div>
      <div class="text-muted" style="font-size:.75rem;">
        {{ item.weekday_label }} · 今天还没写
      </div>
    </div>
    <a class="btn btn-sm btn-success flex-shrink-0" href="{{ item.write_url }}">去写日志</a>
  </div>
{% endfor %}
